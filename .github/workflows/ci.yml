# CI/CD Pipeline for MediaForgePS
# Performs: build, test (C# unit, component, E2E, PowerShell), lint (format check), and pack artifacts
# Does NOT publish (per AGENTS.md requirements)

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, 'feat/*', 'bug/*', 'cursor/*' ]

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 🔥 The fix: install PowerShell 7.6 on ALL platforms
      - name: Install PowerShell 7.6
        uses: PowerShell/PowerShell@v2
        with:
          pwsh-version: '7.6.x'

      - name: Verify PowerShell version
        shell: pwsh
        run: pwsh -v

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        shell: pwsh
        run: dotnet restore

      - name: Build
        shell: pwsh
        run: dotnet build --configuration Release --no-restore

      - name: Format check
        shell: pwsh
        run: dotnet format --verify-no-changes

      - name: Run C# unit tests
        shell: pwsh
        run: dotnet test --configuration Release --no-build --logger trx

      - name: Run component tests
        shell: pwsh
        run: ./scripts/Run-ComponentTests.ps1

      - name: Run E2E tests
        shell: pwsh
        run: ./scripts/Run-E2ETests.ps1

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -Force -Scope CurrentUser

      - name: Locate built MediaForgePS.dll
        shell: pwsh
        run: ./scripts/Locate-BuiltModule.ps1

      - name: Run PowerShell unit tests
        shell: pwsh
        run: ./scripts/Run-PowerShellTests.ps1

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/

      - name: Build Release configuration for packaging
        shell: pwsh
        run: dotnet build --configuration Release

      - name: Pack artifacts
        shell: pwsh
        run: dotnet pack --configuration Release --output ./artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: artifacts/
