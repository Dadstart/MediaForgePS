name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - feat/*
      - bug/*
      - cursor/*
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DotnetVersion: 10.0.300
  MinPowerShellVersion: 7.6.0

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DotnetVersion }}

      - name: Ensure PowerShell 7.6+ (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          current="$(pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')"
          minimum="${{ env.MinPowerShellVersion }}"
          if [ "$(printf '%s\n' "$minimum" "$current" | sort -V | head -n 1)" = "$minimum" ]; then
            echo "PowerShell $current already meets minimum version."
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install --yes powershell

      - name: Ensure PowerShell 7.6+ (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          current="$(pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')"
          minimum="${{ env.MinPowerShellVersion }}"
          if [ "$(printf '%s\n' "$minimum" "$current" | sort -V | head -n 1)" = "$minimum" ]; then
            echo "PowerShell $current already meets minimum version."
            exit 0
          fi

          brew update
          brew install powershell

      - name: Ensure PowerShell 7.6+ (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $current = [Version](pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')
          $minimum = [Version]'${{ env.MinPowerShellVersion }}'
          if ($current -lt $minimum) {
            winget install --id Microsoft.PowerShell --source winget --accept-package-agreements --accept-source-agreements
            'C:\Program Files\PowerShell\7' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Verify PowerShell version
        run: |
          $current = [Version]$PSVersionTable.PSVersion.ToString()
          $minimum = [Version]'${{ env.MinPowerShellVersion }}'
          if ($current -lt $minimum) {
            throw "PowerShell $minimum or higher is required. Current version: $current"
          }
          Write-Host "Using PowerShell $current"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('MediaForgePS.sln', '**/*.csproj', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build, lint, and test via Build.ps1
        run: |
          ./scripts/Build.ps1 `
            -Configuration Release `
            -Build `
            -Lint View `
            -Test `
            -Verbosity minimal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            **/TestResults/*.trx
            **/TestResults/*.xml
            **/coverage.cobertura.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Pack artifacts
        if: runner.os == 'Linux'
        run: dotnet pack MediaForgePS.sln --configuration Release --no-build --output ./artifacts

      - name: Upload packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 30